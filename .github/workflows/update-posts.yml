name: Update Insights Posts

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 6 AM UTC
  workflow_dispatch:        # manual trigger from GitHub UI
  repository_dispatch:
    types: [new-post]       # triggered by Rain repo on new publish

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Fetch and parse latest posts
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import re
          import unicodedata
          from html.parser import HTMLParser
          from datetime import datetime

          BASE_URL = "https://sherryanalytics.github.io/rain/garden-of-thoughts/"
          MAX_POSTS = 5

          def fetch(url, timeout=15):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", errors="ignore")

          def has_cjk(text):
              return any(unicodedata.category(ch) in ("Lo",) and ord(ch) > 0x2E7F for ch in text)

          def date_from_filename(href):
              m = re.match(r"(\d{4}-\d{2}-\d{2})", href)
              return m.group(1) if m else None

          def fmt_date(date_str):
              try:
                  return datetime.strptime(date_str, "%Y-%m-%d").strftime("%b %Y")
              except Exception:
                  return date_str

          # ── Parse index page ──────────────────────────────────────────────
          class IndexParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.posts = []
                  self._in_li = False
                  self._in_a  = False
                  self._href  = None
                  self._title = []

              def handle_starttag(self, tag, attrs):
                  if tag == "li":
                      self._in_li = True
                      self._href  = None
                      self._title = []
                  elif tag == "a" and self._in_li:
                      self._in_a = True
                      attrs = dict(attrs)
                      if attrs.get("href", "").endswith(".html"):
                          self._href = attrs["href"]

              def handle_endtag(self, tag):
                  if tag == "a":
                      self._in_a = False
                  elif tag == "li":
                      self._in_li = False
                      if self._href and self._title:
                          self.posts.append({
                              "href":  self._href,
                              "title": "".join(self._title).strip(),
                          })

              def handle_data(self, data):
                  if self._in_a:
                      self._title.append(data)

          # ── Parse tags from post page ─────────────────────────────────────
          class TagParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags  = []
                  self._in   = False

              def handle_starttag(self, tag, attrs):
                  cls = dict(attrs).get("class", "")
                  if tag in ("span", "a", "li") and "tag" in cls.split():
                      self._in = True

              def handle_endtag(self, tag):
                  if tag in ("span", "a", "li"):
                      self._in = False

              def handle_data(self, data):
                  if self._in:
                      t = data.strip()
                      if t and re.match(r"^[a-z0-9][a-z0-9-]*$", t):
                          self.tags.append(t)

          def fetch_tags(url):
              try:
                  html = fetch(url, timeout=10)
                  # Try structured parser first
                  p = TagParser()
                  p.feed(html)
                  if p.tags:
                      return list(dict.fromkeys(p.tags))[:4]
                  # Regex fallback: any span/a with class containing "tag"
                  raw = re.findall(
                      r'<(?:span|a)[^>]+class="[^"]*\btag\b[^"]*"[^>]*>\s*([^<]+)\s*</(?:span|a)>',
                      html
                  )
                  tags = [t.strip() for t in raw if re.match(r"^[a-z0-9][a-z0-9-]*$", t.strip())]
                  return list(dict.fromkeys(tags))[:4]
              except Exception as exc:
                  print(f"  warn: could not fetch tags for {url}: {exc}")
                  return []

          # ── Main ──────────────────────────────────────────────────────────
          print("Fetching index…")
          html = fetch(BASE_URL)

          idx = IndexParser()
          idx.feed(html)

          posts = []
          for item in idx.posts:
              if has_cjk(item["title"]):
                  continue
              date = date_from_filename(item["href"])
              if not date:
                  continue
              href = item["href"]
              full_url = href if href.startswith("http") else BASE_URL + href
              posts.append({
                  "title":     item["title"],
                  "url":       full_url,
                  "date":      date,
                  "dateLabel": fmt_date(date),
                  "tags":      [],
              })

          posts.sort(key=lambda x: x["date"], reverse=True)
          posts = posts[:MAX_POSTS]

          print(f"Found {len(posts)} English posts. Fetching tags…")
          for p in posts:
              p["tags"] = fetch_tags(p["url"])
              print(f"  {p['date']} — {p['title'][:60]}  tags={p['tags']}")

          with open("posts.json", "w") as fh:
              json.dump(posts, fh, indent=2, ensure_ascii=False)
          print("Done — posts.json updated.")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet && echo "No changes." || (
            git commit -m "chore: refresh insights posts [skip ci]" &&
            git push
          )
