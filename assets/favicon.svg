<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="drop" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#60b8f5"/>
      <stop offset="100%" stop-color="#1a6bb5"/>
    </linearGradient>
    <linearGradient id="shine" x1="20%" y1="10%" x2="60%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Raindrop shape: teardrop pointing down -->
  <!-- Built from a circle bottom + triangular top meeting at a point -->
  <path d="M16 3 C16 3, 7 14, 7 20 A9 9 0 0 0 25 20 C25 14 16 3 16 3 Z"
        fill="url(#drop)" />

  <!-- Shine highlight -->
  <path d="M16 3 C16 3, 7 14, 7 20 A9 9 0 0 0 25 20 C25 14 16 3 16 3 Z"
        fill="url(#shine)" />

  <!-- Inner lightning bolt / transform symbol in white -->
  <path d="M17.5 12 L13 19 L16.2 19 L14.5 25 L20 17 L16.5 17 Z"
        fill="white" fill-opacity="0.92" />
